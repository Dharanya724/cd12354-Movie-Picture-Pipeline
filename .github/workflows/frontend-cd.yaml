name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-ci.yaml"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  BACKEND_URL: http://acd248471327d452d83337a43fdfb1ba-1472909215.us-east-1.elb.amazonaws.com

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run linter
        working-directory: starter/frontend
        run: npm run lint

  test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run tests
        working-directory: starter/frontend
        env:
          CI: true
        run: npm test

  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Build frontend Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$BACKEND_URL" \
            --tag "$ECR_REGISTRY/frontend:$GITHUB_SHA" \
            ./starter/frontend

      - name: Push frontend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/frontend:$GITHUB_SHA"

      - name: Deploy frontend to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl apply -f starter/frontend/k8s/service.yaml
          kubectl apply -f starter/frontend/k8s/deployment.yaml

          kubectl set image deployment/frontend \
            frontend="$ECR_REGISTRY/frontend:$GITHUB_SHA"

          kubectl rollout status deployment/frontend --timeout=5m

      - name: Verify frontend
        run: |
          FRONTEND_HOST=""

          for attempt in $(seq 1 60); do
            FRONTEND_HOST=$(kubectl get service frontend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$FRONTEND_HOST" ]; then
              break
            fi

            echo "Waiting for frontend LoadBalancer ($attempt/60)..."
            sleep 10
          done

          if [ -z "$FRONTEND_HOST" ]; then
            kubectl describe service frontend
            echo "Frontend LoadBalancer hostname was not assigned."
            exit 1
          fi

          FRONTEND_URL="http://${FRONTEND_HOST}"
          echo "Frontend URL: $FRONTEND_URL"

          curl --fail --silent --show-error \
            --retry 30 --retry-delay 10 --retry-connrefused \
            "$FRONTEND_URL/" \
            -o /dev/null

          echo "Frontend verification succeeded."
          echo "Application URL: $FRONTEND_URL"
