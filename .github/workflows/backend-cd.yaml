name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-ci.yaml"
      - ".github/workflows/backend-cd.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install backend dependencies
        working-directory: starter/backend
        run: pipenv install --dev --deploy

      - name: Run Flake8
        working-directory: starter/backend
        run: pipenv run flake8 --exclude=.venv

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install backend dependencies
        working-directory: starter/backend
        run: pipenv install --dev --deploy

      - name: Run backend tests
        working-directory: starter/backend
        run: pipenv run pytest -v

  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Build backend Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/backend:$GITHUB_SHA" \
            ./starter/backend

      - name: Push backend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push "$ECR_REGISTRY/backend:$GITHUB_SHA"

      - name: Deploy backend to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl apply -f starter/backend/k8s/service.yaml
          kubectl apply -f starter/backend/k8s/deployment.yaml

          kubectl set image deployment/backend \
            backend="$ECR_REGISTRY/backend:$GITHUB_SHA"

          kubectl rollout status deployment/backend --timeout=5m

      - name: Verify backend API
        run: |
          BACKEND_HOST=""

          for attempt in $(seq 1 60); do
            BACKEND_HOST=$(kubectl get service backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$BACKEND_HOST" ]; then
              break
            fi

            echo "Waiting for backend LoadBalancer ($attempt/60)..."
            sleep 10
          done

          if [ -z "$BACKEND_HOST" ]; then
            kubectl describe service backend
            echo "Backend LoadBalancer hostname was not assigned."
            exit 1
          fi

          BACKEND_URL="http://${BACKEND_HOST}"
          echo "Backend URL: $BACKEND_URL"

          curl --fail --silent --show-error \
            --retry 30 --retry-delay 10 --retry-connrefused \
            "$BACKEND_URL/movies"

          echo
          echo "Backend API verification succeeded."
